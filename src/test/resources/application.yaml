spring:
  datasource:
    url: jdbc:h2:mem:team3-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop

app:
  frontend-origin: http://localhost:3000
  jwt:
    secret: test-jwt-secret-must-be-at-least-thirty-two-bytes
    issuer: team3-backend
    access-seconds: 1800
    refresh-seconds: 1209600
  google:
    client-id: local-client
    issuer: https://accounts.google.com
  auth:
    refresh-cookie-secure: false
